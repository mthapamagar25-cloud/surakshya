<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>For Surakshya 🌻</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  font-family:'Cormorant Garamond',Georgia,serif;
  background:linear-gradient(180deg,#fff7e2 0%,#ffe6a8 38%,#ffc874 72%,#ffad5a 100%);
  color:#5a2e0a;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation
}
body::after{content:"";position:fixed;inset:0;z-index:2;pointer-events:none;
  background:radial-gradient(ellipse at 50% 40%,rgba(0,0,0,0) 55%,rgba(140,60,0,.18) 100%)}

/* ---------- sky ---------- */
#rays{
  position:fixed;left:50%;top:calc(6vh + 32vmin);width:220vmax;height:220vmax;z-index:0;pointer-events:none;
  background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.26) 0deg 3.5deg,rgba(255,255,255,0) 3.5deg 13deg);
  -webkit-mask-image:radial-gradient(circle,#000 0%,rgba(0,0,0,.5) 18%,transparent 42%);
  mask-image:radial-gradient(circle,#000 0%,rgba(0,0,0,.5) 18%,transparent 42%);
  transform:translate(-50%,-50%);opacity:0;transition:opacity 3s ease 2s;animation:spin 90s linear infinite
}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
body.open #rays{opacity:1}
#sun{
  position:fixed;left:50%;top:6vh;width:64vmin;height:64vmin;margin-left:-32vmin;border-radius:50%;z-index:0;
  background:radial-gradient(circle,#fffef4 0%,#fff3c4 20%,rgba(255,226,140,.65) 40%,rgba(255,205,110,0) 70%);
  transform:translateY(75vh) scale(.5);opacity:0;
  transition:transform 3.6s cubic-bezier(.2,.7,.2,1),opacity 2.2s ease
}
body.open #sun{transform:none;opacity:1;animation:sunPulse 6s ease-in-out 4s infinite}
@keyframes sunPulse{50%{transform:scale(1.06)}}
.cloud{position:fixed;z-index:1;pointer-events:none;width:170px;height:46px;border-radius:50px;background:#fffaf0;
  filter:blur(5px);opacity:0;transition:opacity 3s ease 1.5s;animation:drift linear infinite}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fffaf0;border-radius:50%}
.cloud::before{width:76px;height:66px;left:26px;top:-32px}
.cloud::after{width:58px;height:52px;left:88px;top:-22px}
body.open .cloud{opacity:.75}
@keyframes drift{from{transform:translateX(-40vw) scale(var(--s))}to{transform:translateX(140vw) scale(var(--s))}}
#field{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:1}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:4}

/* butterflies */
.bf{position:fixed;left:0;top:0;width:40px;height:34px;z-index:4;pointer-events:none;perspective:160px;opacity:0;transition:opacity 1.6s ease}
.bf.on{opacity:1}
.bf .w{position:absolute;top:0;width:20px;height:34px}
.bf .wl{left:0;transform-origin:100% 50%;animation:flapL .26s ease-in-out infinite alternate}
.bf .wr{right:0;transform-origin:0 50%;animation:flapR .26s ease-in-out infinite alternate}
.bf .wr svg{transform:scaleX(-1)}
.bf .bd{position:absolute;left:18px;top:7px;width:4px;height:21px;border-radius:3px;background:#3a1d05}
@keyframes flapL{from{transform:rotateY(0)}to{transform:rotateY(72deg)}}
@keyframes flapR{from{transform:rotateY(0)}to{transform:rotateY(-72deg)}}

/* ---------- night intro ---------- */
#night{position:fixed;inset:0;z-index:5;overflow:hidden;
  background:radial-gradient(ellipse at 50% 118%,#6a2f5c 0%,#2c1645 42%,#0f0a26 100%);transition:opacity 2.8s ease}
body.open #night{opacity:0;pointer-events:none}
.star{position:absolute;border-radius:50%;background:#fff;animation:tw 3s infinite ease-in-out}
@keyframes tw{0%,100%{opacity:.12}50%{opacity:1}}
.shoot{position:absolute;width:120px;height:2px;border-radius:2px;
  background:linear-gradient(90deg,rgba(255,255,255,0),#fff);opacity:0;transform:rotate(-28deg);animation:shoot 7s ease-in infinite}
@keyframes shoot{0%,86%{opacity:0;translate:0 0}88%{opacity:1}100%{opacity:0;translate:260px 140px}}
#intro{position:fixed;inset:0;z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;color:#fbe9c6;padding:24px}
body.open #intro{pointer-events:none}
#intro .txt{opacity:0;animation:up 1.4s cubic-bezier(.2,.7,.2,1) forwards;transition:opacity .7s ease,transform .7s ease}
body.tapped #intro .txt{opacity:0 !important;transform:translateY(10px);animation:none}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
#intro .small{font-weight:600;font-size:clamp(12px,3.6vw,16px);letter-spacing:.42em;text-transform:uppercase;color:#f3d9a8}
#intro .name{font-family:'Great Vibes',cursive;font-size:clamp(62px,17vw,112px);line-height:1.1;padding:0 .2em;
  background:linear-gradient(100deg,#ffb627 0%,#ffe27a 40%,#fffbe6 50%,#ffe27a 60%,#ffb627 100%);background-size:250% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 22px rgba(255,190,60,.45));
  animation:up 1.4s cubic-bezier(.2,.7,.2,1) .3s forwards,shimmer 3.2s ease-in-out 1.8s infinite}
@keyframes shimmer{from{background-position:100% 0}to{background-position:0% 0}}
#flWrap{margin:-10px 0 -14px;animation:float 3.4s ease-in-out infinite;filter:drop-shadow(0 0 26px rgba(255,195,60,.55))}
@keyframes float{50%{transform:translateY(-9px)}}
#introFlower{width:200px;height:200px;display:block;transition:transform 1.9s cubic-bezier(.75,0,.25,1),opacity 1.1s ease .8s}
body.open #introFlower{transform:rotate(160deg) scale(11);opacity:0}
#intro .by{font-style:italic;font-size:clamp(17px,4.6vw,22px);color:#f3d9a8}
#openBtn{
  position:relative;overflow:hidden;margin-top:26px;font:700 clamp(16px,4.4vw,19px) 'Cormorant Garamond',serif;letter-spacing:.12em;text-transform:uppercase;
  color:#3a1d05;background:linear-gradient(180deg,#ffe57a,#ffb627);border:none;border-radius:999px;padding:15px 34px;cursor:pointer;
  box-shadow:0 8px 30px rgba(255,180,40,.35);animation:up 1.4s cubic-bezier(.2,.7,.2,1) 1.1s forwards,pulse 2.4s 2.5s infinite
}
#openBtn::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;
  background:linear-gradient(100deg,rgba(255,255,255,0),rgba(255,255,255,.75),rgba(255,255,255,0));animation:sweep 3s ease-in-out 2s infinite}
@keyframes sweep{0%{left:-60%}55%,100%{left:130%}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,205,70,.6),0 8px 30px rgba(255,180,40,.35)}70%{box-shadow:0 0 0 22px rgba(255,205,70,0),0 8px 30px rgba(255,180,40,.35)}100%{box-shadow:0 0 0 0 rgba(255,205,70,0),0 8px 30px rgba(255,180,40,.35)}}
#flash{position:fixed;inset:0;z-index:7;pointer-events:none;opacity:0;
  background:radial-gradient(circle at 50% 45%,rgba(255,255,245,1) 0%,rgba(255,226,140,.75) 35%,rgba(255,200,90,0) 75%)}
body.open #flash{animation:flash 2s ease-out}
@keyframes flash{0%{opacity:0}35%{opacity:1}100%{opacity:0}}

/* ---------- message ---------- */
#msg{position:fixed;left:0;right:0;top:6.5vh;z-index:3;text-align:center;padding:0 20px;pointer-events:none}
.fade{opacity:0;transform:translateY(16px);filter:blur(6px)}
body.text .fade{opacity:1;transform:none;filter:blur(0);transition:opacity 1.4s ease,transform 1.4s cubic-bezier(.2,.7,.2,1),filter 1.4s ease}
.glow{text-shadow:0 0 14px rgba(255,250,232,.95),0 0 3px rgba(255,250,232,.9)}
#msg .hey{font-weight:700;font-size:clamp(11px,3.2vw,15px);letter-spacing:.42em;text-transform:uppercase;color:#9a5512}
#nameWrap{filter:drop-shadow(0 0 14px rgba(255,248,220,1)) drop-shadow(0 2px 0 rgba(255,255,255,.6))}
#bigname{
  display:inline-block;font-family:'Great Vibes',cursive;font-size:clamp(64px,17.5vw,120px);line-height:1.12;padding:0 .3em .06em;
  background:linear-gradient(100deg,#a94400 0%,#e07f00 30%,#ffe9a0 46%,#e07f00 62%,#a94400 100%);background-size:260% 100%;background-position:100% 0;
  -webkit-background-clip:text;background-clip:text;color:transparent;clip-path:inset(0 100% 0 0)
}
body.text #bigname{animation:write 2.8s .1s cubic-bezier(.55,0,.35,1) forwards,shimmer 3.4s ease-in-out 3.2s infinite}
@keyframes write{to{clip-path:inset(0 0 0 0)}}
.orn{display:flex;align-items:center;justify-content:center;gap:12px;margin:2px 0 12px;color:#d98a10;font-size:18px}
.orn span{display:block;height:1px;width:clamp(50px,18vw,110px);background:linear-gradient(90deg,rgba(217,138,16,0),#d98a10)}
.orn span:last-child{transform:scaleX(-1)}
.orn b{display:inline-block;animation:spinSlow 8s linear infinite}
@keyframes spinSlow{to{transform:rotate(360deg)}}
#msg .line{font-style:italic;font-weight:600;font-size:clamp(18px,4.8vw,25px);line-height:1.4;color:#6b3410;max-width:620px;margin:0 auto}
#msg .sig{font-family:'Great Vibes',cursive;font-size:clamp(32px,8.5vw,46px);color:#a84a05;margin-top:10px}
@media (max-width:600px){#msg{top:calc(6.5vh + 22px)}#msg .hey{letter-spacing:.28em}}
#hint{position:fixed;left:50%;bottom:16px;z-index:4;transform:translateX(-50%);white-space:nowrap;
  background:rgba(255,250,236,.82);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);color:#6b3410;font-weight:700;
  font-size:clamp(13px,3.6vw,16px);letter-spacing:.03em;padding:9px 18px;border-radius:999px;border:1px solid rgba(217,138,16,.35);
  box-shadow:0 6px 20px rgba(120,60,0,.18);pointer-events:none;opacity:0;transition:opacity 1s ease}
body.text #hint{opacity:1;transition-delay:7.5s}
body.planted #hint{opacity:0;transition-delay:0s}
#replay{position:fixed;top:14px;right:14px;z-index:8;width:42px;height:42px;border-radius:50%;cursor:pointer;
  background:rgba(255,250,236,.8);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border:1px solid rgba(217,138,16,.35);
  color:#8a4a12;font-size:20px;box-shadow:0 3px 12px rgba(120,60,0,.18);opacity:0;pointer-events:none;transition:opacity .8s ease}
body.text #replay{opacity:1;pointer-events:auto;transition-delay:8s}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="bfA" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff8a00"/><stop offset="1" stop-color="#ffd23f"/></linearGradient>
    <linearGradient id="bfB" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#ffe9b0"/></linearGradient>
  </defs>
</svg>

<div id="rays"></div>
<div id="sun"></div>
<div class="cloud" style="top:9vh;--s:1;animation-duration:85s;animation-delay:-20s"></div>
<div class="cloud" style="top:22vh;--s:.7;animation-duration:110s;animation-delay:-70s"></div>
<div class="cloud" style="top:4vh;--s:.55;animation-duration:140s;animation-delay:-100s"></div>
<svg id="field" xmlns="http://www.w3.org/2000/svg"></svg>

<div id="msg">
  <div class="hey fade glow" style="transition-delay:.2s">For the sunflower lover</div>
  <div id="nameWrap"><div id="bigname">Surakshya</div></div>
  <div class="orn fade" style="transition-delay:2.3s"><span></span><b>✿</b><span></span></div>
  <div class="line fade glow" style="transition-delay:2.9s">Like sunflowers always find the sun,</div>
  <div class="line fade glow" style="transition-delay:3.9s">may you always find your happiness.</div>
  <div class="line fade glow" style="transition-delay:5.1s;margin-top:10px">You make the whole world bloom brighter.</div>
  <div class="sig fade glow" style="transition-delay:6.4s">Sending sincere Apologies 🌻</div>
</div>

<canvas id="fx"></canvas>

<div id="night">
  <div class="shoot" style="top:12%;left:8%;animation-delay:1s"></div>
  <div class="shoot" style="top:28%;left:45%;animation-delay:4.5s;animation-duration:9s"></div>
</div>
<div id="intro">
  <div class="small txt" style="animation-delay:.1s">A little something for</div>
  <div class="name txt">Surakshya</div>
  <div id="flWrap"><svg id="introFlower" viewBox="-80 -80 160 160" xmlns="http://www.w3.org/2000/svg"></svg></div>
  <div class="by txt" style="animation-delay:.7s">Apologies; Milan</div>
  <button id="openBtn" class="txt">Tap to open 🌻</button>
</div>
<div id="flash"></div>
<button id="replay" aria-label="Replay">↻</button>
<div id="hint">Tap to plant flowers !!🌻🌷</div>

<script>
(function(){
const NS='http://www.w3.org/2000/svg';
const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const pickOf=a=>a[(Math.random()*a.length)|0];
const body=document.body;
const svg=document.getElementById('field');
const introSvg=document.getElementById('introFlower');
let W=innerWidth,H=innerHeight,layers={},timers=[],replayT=null;
const later=(fn,ms)=>timers.push(setTimeout(fn,ms));

function el(tag,attrs,parent){
  const e=document.createElementNS(NS,tag);
  for(const k in attrs)e.setAttribute(k,attrs[k]);
  if(parent)parent.appendChild(e);
  return e;
}
const now=()=>svg.getCurrentTime();
const T=b=>typeof b==='number'?b.toFixed(2)+'s':b;
function grow(target,begin,dur,from){
  return el('animateTransform',{attributeName:'transform',type:'scale',values:`${from||0};1.12;1`,keyTimes:'0;0.7;1',
    calcMode:'spline',keySplines:'0.3 0.7 0.4 1;0.4 0 0.6 1',begin:T(begin),dur:dur+'s',fill:'freeze'},target);
}
function dashGrow(path,begin,dur){
  const len=path.getTotalLength();
  path.setAttribute('stroke-dasharray',len+' '+len);
  path.setAttribute('stroke-dashoffset',len);
  el('animate',{attributeName:'stroke-dashoffset',values:`${len};0`,keyTimes:'0;1',calcMode:'spline',
    keySplines:'0.45 0 0.25 1',begin:T(begin),dur:dur+'s',fill:'freeze'},path);
  return len;
}
const circ=(x,y,r)=>`M${(x-r).toFixed(2)},${y.toFixed(2)}a${r.toFixed(2)},${r.toFixed(2)} 0 1,0 ${(2*r).toFixed(2)},0a${r.toFixed(2)},${r.toFixed(2)} 0 1,0 ${(-2*r).toFixed(2)},0`;

/* ---------- colour definitions ---------- */
const TUL={A:['#ff4f8b','#ffb8d2','#d6336c','#ff7aa8'],B:['#e8202e','#ff8a78','#b3122a','#e8463f'],C:['#8a4fe0','#d6b8ff','#6a35c0','#a77df0'],
           D:['#ffa000','#fff07a','#e08a00','#ffcf3a'],E:['#ffb9d3','#ffffff','#ee98b8','#ffe0ec']};
const ROSE={red:['#ff7a8c','#ee3b58','#cf2244','#a3112f','#7a0a22'],pink:['#ffc8d8','#ff9cba','#f56d97','#d94a7a','#b02f5e'],
            peach:['#ffe4cc','#ffc6a0','#f9a177','#e07f58','#b85e3c']};
const WILD=['#7fb3ff','#ff9ec7','#ffffff','#c7a6ff','#ffd23f','#ff8a8a','#a8d8ff'];
let tg='';
for(const k in TUL){const [a,b,c,d]=TUL[k];
  tg+=`<linearGradient id="t${k}" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient>`+
      `<linearGradient id="t${k}d" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="${c}"/><stop offset="1" stop-color="${d}"/></linearGradient>`;}
const DEFS=`<defs>
  <linearGradient id="pf" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#f29a00"/><stop offset=".55" stop-color="#ffc414"/><stop offset="1" stop-color="#ffe066"/></linearGradient>
  <linearGradient id="pb" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#c46400"/><stop offset="1" stop-color="#f0a00c"/></linearGradient>
  <radialGradient id="dk"><stop offset="0" stop-color="#7d4c15"/><stop offset=".6" stop-color="#4a250a"/><stop offset="1" stop-color="#2c1503"/></radialGradient>
  <linearGradient id="lf" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3c8420"/><stop offset="1" stop-color="#6fc23c"/></linearGradient>
  <linearGradient id="lfd" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#235c19"/><stop offset="1" stop-color="#4d9c36"/></linearGradient>
  <linearGradient id="lfv" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#2f7a1c"/><stop offset="1" stop-color="#86cf52"/></linearGradient>
  <linearGradient id="dz" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ece6f6"/><stop offset=".4" stop-color="#ffffff"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
  <linearGradient id="dzp" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#ffe8f1"/><stop offset="1" stop-color="#ff8fbd"/></linearGradient>
  <linearGradient id="dzb" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#cfc5e6"/><stop offset="1" stop-color="#f1ecfa"/></linearGradient>
  <radialGradient id="dc"><stop offset="0" stop-color="#ffe680"/><stop offset=".6" stop-color="#ffb81f"/><stop offset="1" stop-color="#d98208"/></radialGradient>
  <linearGradient id="pp" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#9c0f08"/><stop offset=".3" stop-color="#f2311a"/><stop offset="1" stop-color="#ff8a4a"/></linearGradient>
  <linearGradient id="ppd" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#7a0b06"/><stop offset="1" stop-color="#e0301a"/></linearGradient>
  <linearGradient id="pq" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#a8124a"/><stop offset=".35" stop-color="#ff5f8a"/><stop offset="1" stop-color="#ffb3c4"/></linearGradient>
  <linearGradient id="pqd" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#850d3a"/><stop offset="1" stop-color="#e85a80"/></linearGradient>
  <linearGradient id="h0" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bcd97a"/><stop offset="1" stop-color="#8dbb52"/></linearGradient>
  <linearGradient id="h1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a2cf5e"/><stop offset="1" stop-color="#6ea43b"/></linearGradient>
  <linearGradient id="h2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6db03c"/><stop offset="1" stop-color="#3e7c21"/></linearGradient>
  ${tg}
</defs>`;

/* ---------- flower heads ---------- */
function head(hg,R,from,sepals){            // sunflower
  const cr=R*.42,N=R>45?22:R>28?18:15,petals=[];
  if(sepals){
    for(let i=0;i<14;i++){
      const g=el('g',{transform:`rotate(${i*360/14+8})`},hg);
      el('path',{d:`M${-R*.13},${-cr*.6} Q0,${-R*1.12} ${R*.13},${-cr*.6}Z`,fill:i%2?'#4c8f27':'#5aa630'},g);
    }
  }
  [['url(#pb)',R*.66,0,0,false],['url(#pf)',R*.6,180/N,.15,true]].forEach(([fill,L,off,dl,front])=>{
    const w=L*.3;
    const d=`M0,0 C${w},${-L*.25} ${w*.85},${-L*.78} 0,${-L} C${-w*.85},${-L*.78} ${-w},${-L*.25} 0,0Z`;
    for(let i=0;i<N;i++){
      const pg=el('g',{transform:`rotate(${(i*360/N+off+rnd(-3,3)).toFixed(1)}) translate(0,${(-cr*.8).toFixed(1)})`},hg);
      const inner=el('g',{transform:`scale(${from})`},pg);
      el('path',{d,fill},inner);
      if(front&&R>22)el('path',{d:`M0,${-L*.14} L0,${-L*.8}`,stroke:'rgba(255,246,196,.55)','stroke-width':Math.max(.6,R*.012),fill:'none'},inner);
      petals.push([inner,dl+(i/N)*.3]);
    }
  });
  const cg=el('g',{},hg);
  el('circle',{r:cr,fill:'url(#dk)'},cg);
  const n=Math.round(clamp(cr*cr*.35,30,220)),sr=cr*.9*Math.sqrt(1/n)*.8;
  let dl='',dd='';
  for(let k=1;k<=n;k++){
    const rr=cr*.9*Math.sqrt(k/n),th=k*2.39996,c=circ(rr*Math.cos(th),rr*Math.sin(th),sr*(.6+.5*k/n));
    if(k<n*.3)dl+=c;else dd+=c;
  }
  el('path',{d:dl,fill:'#b58a2c'},cg);
  el('path',{d:dd,fill:'#1f0e02',opacity:.75},cg);
  el('circle',{r:cr,fill:'none',stroke:'#2a1303','stroke-width':Math.max(1,cr*.08)},cg);
  el('ellipse',{cx:-cr*.3,cy:-cr*.35,rx:cr*.35,ry:cr*.2,fill:'#fff',opacity:.08},cg);
  return {petals,disk:cg};
}
function sunHead(hg,R,hb){
  const h=head(hg,R,0,false);
  h.petals.forEach(([inner,dl])=>grow(inner,hb+dl,.75));

    poppy:()=>[rnd(.71,.83),clamp(mn*rnd(.06,.075),22,54)],
    daisy:()=>[rnd(.8,.88),clamp(mn*rnd(.05,.065),18,44)]};
  const pick=()=>{if(!bag.length){bag.push('sun','sun','sun','rose','rose','tulip','tulip','poppy','daisy','daisy');bag.sort(()=>Math.random()-.5)}return bag.pop()};
  const nf=clamp(Math.round(W/95),5,14);
  for(let i=0;i<nf;i++){
    const x=(i+.5)*W/nf+rnd(-.25,.25)*W/nf,ty=pick(),[fy,R]=SPEC[ty]();
    const f=flower(layers.front,x,H+6,x+rnd(-25,25),H*fy,R,t0+.4+rnd(0,1.2),ty);
    if(ty==='sun')heads.push(f);
  }
  heads.push(flower(layers.front,W/2+rnd(-10,10),H+6,W/2,H*.63,clamp(mn*.12,40,95),t0+.2,'sun'));
  // foreground daisies & wildflowers
  for(let i=0,n=clamp(Math.round(W/38),8,34);i<n;i++){
    const x=(i+.5)*W/n+rnd(-.4,.4)*W/n;
    if(Math.random()<.55)flower(layers.fore,x,H+6,x+rnd(-8,8),H*rnd(.88,.94),clamp(mn*rnd(.03,.042),11,26),t0+.8+rnd(0,1.6),'daisy');
    else flower(layers.fore,x,H+6,x+rnd(-6,6),H*rnd(.9,.96),rnd(5,8)*(mn>700?1.4:1),t0+.8+rnd(0,1.6),'wild',{still:true});
  }
  corner(false,t0+1);corner(true,t0+1.25);
}
function clearFlowers(){['far','back','front','planted','fore','frame'].forEach(k=>{while(layers[k].firstChild)layers[k].removeChild(layers[k].firstChild)})}

/* ---------- butterflies ---------- */
const wing=f=>`<svg viewBox="0 0 20 34" width="20" height="34"><path d="M20 13 C13 -1 2 -2 1 8 C0 16 9 17 20 17Z" fill="url(#${f})" stroke="#4a2405" stroke-width="1.1"/><path d="M20 17 C11 19 3 25 6 31 C9 36 17 29 20 19Z" fill="url(#${f})" stroke="#4a2405" stroke-width="1.1"/><circle cx="6" cy="7" r="1.3" fill="#fff"/><circle cx="9" cy="28" r="1.1" fill="#fff"/><circle cx="4" cy="11" r=".9" fill="#4a2405"/></svg>`;
let bfs=[];
function makeButterflies(){
  bfs.forEach(b=>b.el.remove());bfs=[];
  for(let i=0,n=W<600?3:5;i<n;i++){
    const d=document.createElement('div');d.className='bf';
    const f=i%3===2?'bfB':'bfA';
    d.innerHTML=`<div class="w wl">${wing(f)}</div><div class="bd"></div><div class="w wr">${wing(f)}</div>`;
    d.querySelectorAll('.w').forEach(w=>w.style.animationDuration=rnd(.2,.32).toFixed(2)+'s');
    document.body.appendChild(d);
    bfs.push({el:d,x:Math.random()<.5?-30:W+30,y:H*rnd(.25,.7),a:rnd(0,6.28),sp:rnd(1,1.7),sc:rnd(.7,1.05),ph:rnd(0,6.28)});
  }
}
function showButterflies(){bfs.forEach((b,i)=>later(()=>b.el.classList.add('on'),i*700))}
function moveButterflies(t){
  for(const b of bfs){
    if(!b.el.classList.contains('on'))continue;
    b.a+=rnd(-.09,.09);
    if(b.x<30||b.x>W-30||b.y<H*.12||b.y>H*.82){
      let da=Math.atan2(H*.5-b.y,W/2-b.x)-b.a;
      while(da>Math.PI)da-=6.283;while(da<-Math.PI)da+=6.283;b.a+=da*.08;
    }
    b.x+=Math.cos(b.a)*b.sp;b.y+=Math.sin(b.a)*b.sp+Math.sin(t*.07+b.ph)*.7;
    b.el.style.transform=`translate(${b.x-20}px,${b.y-17}px) rotate(${(b.a*57.3+90).toFixed(1)}deg) scale(${b.sc})`;
  }
}

/* ---------- canvas fx: petals, pollen glow, heart ---------- */
const cv=document.getElementById('fx'),cx=cv.getContext('2d');
const YEL=['#ffc21a','#ffd84a','#f7a400','#ffb000','#ffe27a'];
const PAL=YEL.concat(['#ffc21a','#ff9ec7','#ffc2d9','#fff2f6','#d9c4ff']);
let DPR=1,parts=[],ambient=false,tick=0,heart=null;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;cx.setTransform(DPR,0,0,DPR,0,0)}
function petal(o){parts.push(Object.assign({type:'p',r:rnd(0,6.28),vr:rnd(-.06,.06),s:rnd(5,10),c:pickOf(PAL),a:1,ph:rnd(0,6.28),age:0},o))}
function burst(x,y,n){for(let i=0;i<n;i++){const a=rnd(0,6.28),sp=rnd(1.5,5);petal({type:'b',x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-1.6})}}
function formHeart(){
  const S=Math.min(W*.47/16,H*.0186),n=W<600?72:100;
  heart={cx:W/2,cy:H*.07+12*S,S,t0:performance.now()};
  for(let i=0;i<n;i++){
    const t=i/n*6.2832;
    const hx=16*Math.pow(Math.sin(t),3),hy=-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t));
    const src=heads.length?pickOf(heads):{x:rnd(0,W),y:H*.8,R:20};
    petal({type:'h',x:src.x+rnd(-src.R,src.R)*.6,y:src.y+rnd(-src.R,src.R)*.6,tx:hx*S,ty:hy*S,d:i*.9,a:0,s:rnd(6,9.5),c:pickOf(YEL)});
  }
  later(()=>{
    if(!heart)return;
    for(const p of parts)if(p.type==='h'){
      const a=Math.atan2(p.y-heart.cy,p.x-heart.cx),sp=rnd(2,5.5);
      p.type='b';p.vx=Math.cos(a)*sp;p.vy=Math.sin(a)*sp-1;p.a=1;
    }
    heart=null;
  },8200);
}
const pulse=x=>{x=((x%1)+1)%1;return Math.exp(-Math.pow(x/.07,2))+Math.exp(-Math.pow((x-1)/.07,2))};
function drawPetal(p){
  cx.save();cx.globalAlpha=Math.max(0,Math.min(1,p.a));cx.translate(p.x,p.y);cx.rotate(p.r);
  cx.scale(1,.4+.6*Math.abs(Math.cos(tick*.05+p.ph)));
  cx.fillStyle=p.c;cx.beginPath();cx.ellipse(0,0,p.s,p.s*.42,0,0,6.283);cx.fill();
  cx.fillStyle='rgba(255,250,210,.45)';cx.beginPath();cx.ellipse(-p.s*.2,-p.s*.08,p.s*.45,p.s*.12,0,0,6.283);cx.fill();
  cx.restore();
}
function loop(ts){
  tick++;
  if(ambient){
    let amb=0,gl=0;for(const p of parts){if(p.type==='p')amb++;else if(p.type==='g')gl++}
    if(amb<(W<600?20:36)&&Math.random()<.16)petal({x:rnd(-60,W),y:-20,vx:rnd(.2,.9),vy:rnd(.5,1.3)});
    if(gl<(W<600?26:45)&&Math.random()<.3)parts.push({type:'g',x:rnd(0,W),y:H*rnd(.45,1),vx:rnd(-.2,.2),vy:-rnd(.15,.5),s:rnd(1,2.4),ph:rnd(0,6.28),age:0,life:rnd(260,520)});
  }
  cx.clearRect(0,0,W,H);
  let beat=1,hx=0,hy=0;
  if(heart){
    const e=(ts-heart.t0)/1000;
    if(e>2.2)beat=1+.07*pulse((e-2.2)*1.1)+.045*pulse((e-2.2)*1.1-.2);
    hx=heart.cx;hy=heart.cy;
    const ga=clamp((e-1.5)/1.5,0,1)*(.22+.12*(beat-1)/.07);
    const gr=cx.createRadialGradient(hx,hy,0,hx,hy,heart.S*20);
    gr.addColorStop(0,`rgba(255,215,110,${ga})`);gr.addColorStop(1,'rgba(255,215,110,0)');
    cx.fillStyle=gr;cx.fillRect(0,0,W,H);
  }
  cx.globalCompositeOperation='lighter';
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];if(p.type!=='g')continue;
    p.age++;p.x+=p.vx+Math.sin(p.age*.03+p.ph)*.3;p.y+=p.vy;
    if(p.age>p.life){parts.splice(i,1);continue}
    const f=Math.min(1,p.age/40,(p.life-p.age)/40)*(.55+.45*Math.sin(p.age*.12+p.ph));
    cx.fillStyle=`rgba(255,236,150,${.16*f})`;cx.beginPath();cx.arc(p.x,p.y,p.s*4.5,0,6.283);cx.fill();
    cx.fillStyle=`rgba(255,250,220,${.9*f})`;cx.beginPath();cx.arc(p.x,p.y,p.s,0,6.283);cx.fill();
  }
  cx.globalCompositeOperation='source-over';
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];if(p.type==='g')continue;
    p.age++;
    if(p.type==='b'){p.vy+=.06;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.a-=.007}
    else if(p.type==='p'){p.x+=p.vx+Math.sin(tick*.02+p.ph)*.6;p.y+=p.vy}
    else if(p.type==='h'){
      if(p.age<p.d)continue;
      if(!heart){p.type='b';p.vx=0;p.vy=0;continue}
      const X=hx+p.tx*beat,Y=hy+p.ty*beat,dx=X-p.x,dy=Y-p.y;
      p.x+=dx*.05-dy*.014;p.y+=dy*.05+dx*.014;p.a=Math.min(1,p.a+.04);
    }
    p.r+=p.vr;
    if(p.y>H+30||p.a<=0||p.x>W+70||p.x<-90){parts.splice(i,1);continue}
    drawPetal(p);
  }
  moveButterflies(tick);
  requestAnimationFrame(loop);
}

/* ---------- stars ---------- */
(function(){
  const n=document.getElementById('night');
  for(let i=0;i<90;i++){
    const s=document.createElement('div');s.className='star';const z=rnd(1,2.6);
    s.style.cssText=`width:${z}px;height:${z}px;left:${rnd(0,100)}%;top:${rnd(0,80)}%;animation-delay:${rnd(0,3)}s;animation-duration:${rnd(2,4.5)}s`;
    n.appendChild(s);
  }
})();

/* ---------- timeline ---------- */
const openBtn=document.getElementById('openBtn');
openBtn.addEventListener('click',()=>{
  if(body.classList.contains('tapped'))return;
  if(replayT){clearTimeout(replayT);replayT=null;clearFlowers()}
  body.classList.add('tapped');
  bloomIntro();
  later(()=>{body.classList.add('open');burst(W/2,H*.45,34)},1300);
  later(growField,1500);
  later(()=>{ambient=true},2400);
  later(()=>body.classList.add('text'),3400);
  later(showButterflies,4300);
  later(formHeart,11200);
});

document.addEventListener('pointerdown',e=>{
  if(!body.classList.contains('text')||e.target.closest('button'))return;
  burst(e.clientX,e.clientY,12);
  if(e.clientY>H*.42){
    const y=clamp(e.clientY,H*.42,H*.9),x=e.clientX,mn=Math.min(W,H),r=Math.random(),b=now()+.02;
    if(r<.45)heads.push(flower(layers.planted,x+rnd(-20,20),H+6,x,y,clamp(mn*rnd(.06,.09),24,70),b,'sun'));
    else if(r<.6)flower(layers.planted,x+rnd(-15,15),H+6,x,y,clamp(mn*rnd(.045,.06),17,40),b,'tulip');
    else if(r<.75)flower(layers.planted,x+rnd(-15,15),H+6,x,y,clamp(mn*rnd(.05,.065),20,46),b,'rose');
    else if(r<.87)flower(layers.planted,x+rnd(-15,15),H+6,x,y,clamp(mn*rnd(.05,.065),18,44),b,'daisy');
    else if(r<.95)flower(layers.planted,x+rnd(-15,15),H+6,x,y,clamp(mn*rnd(.06,.075),22,54),b,'poppy');
    else for(let k=0;k<3;k++){const xx=x+rnd(-14,14);flower(layers.planted,xx,H+6,xx+rnd(-8,8),y+rnd(-10,20),clamp(mn*.035,11,22),b+k*.1,'lavender')}
    while(layers.planted.childNodes.length>36)layers.planted.removeChild(layers.planted.firstChild);
    body.classList.add('planted');
  }
});

document.getElementById('replay').addEventListener('click',()=>{
  timers.forEach(clearTimeout);timers=[];
  body.classList.remove('tapped','open','text','planted');
  ambient=false;parts=[];heart=null;
  bfs.forEach(b=>b.el.classList.remove('on'));
  buildIntro();
  replayT=setTimeout(()=>{replayT=null;clearFlowers();makeButterflies()},1500);
});

let lastW=W,rt;
addEventListener('resize',()=>{
  clearTimeout(rt);
  rt=setTimeout(()=>{
    const wc=innerWidth!==lastW;lastW=innerWidth;
    if(wc){buildScene();if(body.classList.contains('open'))growField()}
    else{W=innerWidth;H=innerHeight}
    fit();
  },250);
});

buildScene();buildIntro();makeButterflies();fit();requestAnimationFrame(loop);
})();

</script>
</body>
